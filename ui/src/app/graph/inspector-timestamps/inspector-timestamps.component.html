@let localTimestamps = timestamps();
@if (localTimestamps) {
  <div class="container">
    <h3>Information</h3>
    <div class="inspector-timestamps" [class]="layout()">
    @if (localTimestamps.createdAt) {
      <app-details-item item="Created">{{ localTimestamps.createdAt | date: 'medium' }}</app-details-item>
    }
    @if (localTimestamps.updatedAt) {
      <app-details-item item="Modified">{{ localTimestamps.updatedAt | date: 'medium' }}</app-details-item>
    }
    </div>
  </div>
}
