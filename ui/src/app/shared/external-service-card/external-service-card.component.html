@if (connectionConfig(); as service) {
  <mat-card appearance="outlined" class="service-card">
    <mat-card-header>
      <img [src]="getServiceIcon()" alt="{{service.name}} icon" class="service-icon-large" />
      <div class="service-header-text">
        <mat-card-title>{{service.name}}</mat-card-title>
        <mat-card-subtitle>External service</mat-card-subtitle>
      </div>
    </mat-card-header>
    <mat-card-content>
      <div class="service-card-content">
        <p class="description-text">{{service.description}}</p>
        <div class="links-row">
          @if (service.href) {
            <a [href]="service.href" target="_blank" rel="noopener noreferrer">
              <button mat-stroked-button
                [matTooltip]="service.href"
                matTooltipShowDelay="500">
                Open service
                <mat-icon iconPositionEnd>open_in_new</mat-icon>
              </button>
            </a>
          }
          @if (service.documentationUrl) {
            <a [href]="service.documentationUrl" target="_blank" rel="noopener noreferrer">
              <button mat-stroked-button
                matTooltip="{{service.documentationUrl}}"
                matTooltipShowDelay="500">
                Documentation
                <mat-icon iconPositionEnd>open_in_new</mat-icon>
              </button>
            </a>
          }
          @if (service.vertexId) {
            <button mat-stroked-button
              (click)="openInBrowser()">
              View
            </button>
            <button mat-stroked-button
              (click)="openInGraph()">
              View on Graph
            </button>
          }
        </div>
      </div>
    </mat-card-content>
  </mat-card>
}
