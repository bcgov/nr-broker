apiVersion: backstage.io/v1alpha1
kind: Component
spec:
  system: nr-broker
  type: library
  lifecycle: production
  owner: Oscar
metadata:
  name: nr-broker-ui
  description: NR Broker UI
  title: NR Broker UI
  annotations:
    license: Apache-2.0
    github.com/project-slug: bcgov-nr/nr-broker
  tags:
    - frontend
  links:
    - env: development
      type: instance
      title: development
      url: https://nr-broker-dev.apps.silver.devops.gov.bc.ca
    - env: test
      type: instance
      title: test
      url: https://nr-broker-test.apps.silver.devops.gov.bc.ca
    - env: production
      type: instance
      title: production
      url: https://broker.io.nrs.gov.bc.ca
